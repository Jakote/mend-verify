<h1 style="font-size:1.35rem">Verify now lives here</h1>
<p>All three platforms and the verification desk are served from one address, so a document you have verified once counts on every one of them. That only works if they share an origin, and separate subdomains do not.</p>
<p><a href="https://platforms.mendgroup.co.za/verify/">https://platforms.mendgroup.co.za/verify/</a></p>
<script>
(function () {
  var go = function () { location.replace('https://platforms.mendgroup.co.za/verify/' + location.hash); };
  var jobs = [];
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches && caches.keys) {
      jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }));
    }
  } catch (e) {}
  Promise.all(jobs).then(go, go);
  setTimeout(go, 2500);
}());
</script>
